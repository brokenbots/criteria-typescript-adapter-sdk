version: v2
managed:
  enabled: true

# The canonical adapter proto lives in the criteria-adapter-proto repo
# (v0.5.1+ already removed the legacy map<string,string> outputs field; field 2
# is reserved and outputs_json is the sole output channel). Generating from the
# canonical source keeps these bindings from drifting.
inputs:
  - directory: ../criteria-adapter-proto/proto

plugins:
  - local: protoc-gen-es
    out: src/proto
    opt:
      - target=ts
      - import_extension=.js

  - local: protoc-gen-connect-es
    out: src/proto
    opt:
      - target=ts
      - import_extension=.js
