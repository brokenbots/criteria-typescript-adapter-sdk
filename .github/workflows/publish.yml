name: Publish SDK

# Publishes @brokenbots/criteria-typescript-adapter-sdk on a v* tag.
#
# The version is taken from the tag and is the single source of truth: package.json
# ships a 0.0.0 placeholder and this workflow stamps the real version in with
# `npm version` before building. `bun run build` regenerates src/version.ts
# (SDK_VERSION) from package.json, so the runtime constant tracks the tag too.
#
# Targets (no long-lived npm token):
#   - GitHub Packages (npm.pkg.github.com) via the built-in GITHUB_TOKEN.
#     Always on; needs no setup.
#   - npmjs.org via OIDC Trusted Publishing + provenance (no NPM_TOKEN secret).
#     DISABLED by default — not ready for public npm yet. Enable by setting the
#     repository variable PUBLISH_NPMJS=true once the steps below are ready.
#
# One-time setup before enabling the npmjs.org (OIDC) target:
#   On npmjs.org, configure a "Trusted Publisher" for this package pointing at
#   repo `brokenbots/criteria-typescript-adapter-sdk`, workflow `publish.yml`.
#   npm's trusted publishing requires the package to already exist, so the very
#   first release must be bootstrapped once (publish manually with a granular
#   token, or scope the trusted publisher at the org level) before OIDC works.
#   Then set repository variable PUBLISH_NPMJS=true to turn the steps on.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.2.3). Required for manual runs.'
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Packages
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          if [ -z "$version" ]; then
            echo "::error::No version resolved. For manual runs, set the 'version' input."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp version from tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      # --- GitHub Packages: built-in GITHUB_TOKEN (always on) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@brokenbots'

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      # --- npmjs.org: OIDC trusted publishing (no token) + provenance ---
      # Disabled until we're ready to publish publicly. Flip on by setting the
      # repository variable PUBLISH_NPMJS to 'true' (Settings > Secrets and
      # variables > Actions > Variables) once the npmjs Trusted Publisher is
      # configured. Runs after GitHub Packages so the GH publish is never blocked.
      - uses: actions/setup-node@v4
        if: vars.PUBLISH_NPMJS == 'true'
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        if: vars.PUBLISH_NPMJS == 'true'
        run: npm install -g npm@latest

      - name: Publish to npmjs.org
        if: vars.PUBLISH_NPMJS == 'true'
        run: npm publish --provenance --access public
