name: Publish SDK

# Publishes @criteria/adapter-sdk to npm on a v* tag.
#
# Prerequisites (one-time, owner-controlled):
#   - The @criteria scope/org exists on npmjs and this repo's publisher owns it.
#   - An NPM_TOKEN repo secret with publish rights to @criteria.
# If the team prefers GitHub Packages instead of npmjs, point registry-url at
# https://npm.pkg.github.com and use the built-in GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        run: bun run build

      - name: Verify package version matches tag
        if: github.ref_type == 'tag'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) != tag ($tag_version)"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set — skipping publish. Configure the @criteria npm scope and an NPM_TOKEN secret to enable publishing."
            exit 0
          fi
          npm publish
