version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/brokenbots/criteria/sdk/pb/criteria/v1;criteriav1

inputs:
  - directory: ../criteria/proto

plugins:
  - local: protoc-gen-python
    out: ../astrocyte-python-adapter-sdk/src

  - local: protoc-gen-grpc-python
    out: ../astrocyte-python-adapter-sdk/src
